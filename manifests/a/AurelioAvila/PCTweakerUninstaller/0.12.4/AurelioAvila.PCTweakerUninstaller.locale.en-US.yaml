ReleaseNotes: |-
  Match leftovers to the program's name rather than its publisher.
  Protect install folders shared with other installed programs.
  Back up registry keys before removal and leave them unselected by default.
  Report a restore-point request rather than claiming creation.
  Retain offline Pro access with the licence saved on this PC.
