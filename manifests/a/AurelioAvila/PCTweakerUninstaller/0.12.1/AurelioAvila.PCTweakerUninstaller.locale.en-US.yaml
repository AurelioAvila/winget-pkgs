ShortDescription: Uninstall Windows programs with removal guidance, a restore-point attempt and a local removal receipt.
Description: |-
  PC Tweaker Uninstaller lists every installed program, classic desktop software and Microsoft Store packages alike, and scores how risky removing each one is with the reasons behind that score shown rather than asserted. Before anything runs it shows the exact command that will execute and the permissions it will request, and attempts a Windows restore point first when supported and permitted, reporting the outcome.
  Every removal appends a local receipt recording the program, the method used, whether it succeeded, the exit code, whether a reboot is pending, whether the restore point was created, and the space the removal actually freed rather than the size the program claimed. The receipt stays on the machine and exports to a file on request.
  Single uninstalls are free. Uninstaller Pro adds cleaning the leftovers the free scan finds and batch removal.
