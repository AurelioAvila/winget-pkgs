ReleaseNotes: |-
  Faster repeat scans: Microsoft Catalog metadata is kept locally for 30 days and rechecked on every use.
  One full scan for everyone; the Free plan includes 3 driver downloads a month, Pro is unlimited on up to 2 PCs.
  Live count of devices with update options while the scan runs; stopping a scan now ends it.
  Larger, more legible text, clearer small icons and a window sized to the screen.
  Device detection, compatibility checks, downloads and supported installations remain separate steps.
