ReleaseNotes: Tweaky Driver 0.1.10 refreshes the desktop interface, clarifies package sources and installed/available versions, and interrupts pending component-catalog reads when a scan is stopped. Cancellation never triggers a retry. No new driver sources, fixed scan duration or universal coverage is claimed; downloading and installing remain separate steps.
